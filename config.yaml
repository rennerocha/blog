baseurl: "https://rennerocha.com/"
languageCode: "en"
title: "Renne Rocha"
theme: "hugo-tania"
pagination:
  pagerSize: 6

params:
  author:
    name: "Renne Rocha"
    email: "blog@rocha.dev.br"
  siteName: "Sharing what I learn about software development mainly"
  siteDesc: "Sharing what I learn about software development mainly"

  colorScheme:
    toggle: true
    default: auto

  maxCategoryToShow: 10

  # Show your social information with icon on index bio with `_index.md` content.
  socialOptions:
    rss: "/index.xml"
    email: "renne@rocha.dev.br"
    github: "https://github.com/sponsors/rennerocha"
    mastodon: "https://chaos.social/@rennerocha"
    peertube: "https://peertube.lhc.net.br/a/rocha/video-channels"

  # Comments settings
  comments:
    enabled: true
    provider: mastodon
    commentsEmail: "blog@rennerocha.com"

menu:
  header:
    - name: About Me
      url: "/about-me/"
    - name: Articles
      url: "/articles/"
  footer:
    - name: RSS
      url: "/index.xml"

markup:
  highlight:
    anchorLineNos: false
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    hl_inline: false
    lineAnchors: ""
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    noClasses: true
    style: monokai
    tabWidth: 4
    wrapperClass: highlight
  goldmark:
    renderer:
      unsafe: true

outputs:
  home:
  - html
  - rss
  - json
